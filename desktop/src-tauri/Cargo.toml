[package]
name = "shuvpn_desktop"
version = "0.6.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
default-run = "shuvpn"

[workspace]
members = ["."]

[lib]
name = "shuvpn_desktop"

[[bin]]
name = "shuvpn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
shuvpn_core = { path = "../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
windows-registry = "=0.6.1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.12.4", features = ["test"] }
anyhow = "1"
base64 = "0.23"
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
hickory-proto = { version = "=0.25.2", default-features = false, features = ["std"] }
sangfor-core = { path = "../../third_party/sangfor/sangfor-core" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
