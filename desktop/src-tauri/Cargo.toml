[package]
name = "shuvpn_desktop"
version = "0.6.2"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
default-run = "shuvpn"

[lib]
name = "shuvpn_desktop"

[[bin]]
name = "shuvpn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
shuvpn_core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
windows-registry = "=0.6.1"

[dev-dependencies]
tempfile.workspace = true
tauri = { version = "=2.12.4", features = ["test"] }
anyhow.workspace = true
base64.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
hickory-proto.workspace = true
sangfor-core.workspace = true

[lints]
workspace = true
