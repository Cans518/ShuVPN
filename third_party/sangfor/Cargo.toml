[workspace]
resolver = "2"
members = ["sangfor-core", "sangfor-tls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/preca-hoshino/flutter_sangfor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hmac = { version = "0.12", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "0.0.2-alpha"
