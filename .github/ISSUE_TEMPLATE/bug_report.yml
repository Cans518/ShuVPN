name: 问题报告
description: 报告连接、界面或安装问题
body:
  - type: markdown
    attributes:
      value: 请移除密码、验证码、Cookie、Token 和个人信息。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: ShuVPN 版本
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与桌面环境
      placeholder: Windows 11 / Ubuntu 24.04 GNOME
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的错误文字或截图
