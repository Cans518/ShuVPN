name: Verify ShuVPN

on:
  push:
    branches: [main, "release/**"]
    paths: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "crates/**", "third_party/**", "desktop/**", "packaging/**", "tool/**", "tests/**", ".github/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux desktop and native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev pkg-config libcap2-bin iproute2 python3-gi gir1.2-atspi-2.0 xvfb xdotool xauth x11-utils dbus-x11
      - name: Rust toolchain
        run: rustup show active-toolchain
      - run: npm ci --prefix desktop
      - name: Windows verification and real WebView
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/verify_desktop.ps1 -GuiSmoke
      - name: Linux verification, network namespaces and real WebKit
        if: runner.os == 'Linux'
        run: SHUVPN_GUI_SMOKE=1 SHUVPN_NETWORK_SMOKE=1 bash tool/verify_desktop.sh
      - name: Windows release core and examples
        if: runner.os == 'Windows'
        run: |
          cargo build --locked -p shuvpn_core --release --lib --examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-${{ runner.os }}
          path: build/desktop/tauri
