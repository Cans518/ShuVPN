[package]
name = "shuvpn_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
egress-probe = []
tun-probe = []

[[example]]
name = "egress_namespace_smoke"
required-features = ["egress-probe"]

[[example]]
name = "windows_egress_smoke"
required-features = ["egress-probe"]

[[example]]
name = "windows_tun_smoke"
required-features = ["tun-probe"]

[[example]]
name = "desktop_windows_tun_smoke"
required-features = ["tun-probe"]

[[example]]
name = "desktop_windows_full_smoke"
required-features = ["tun-probe"]

[[example]]
name = "linux_tun_helper_smoke"
required-features = ["tun-probe"]

[[bin]]
name = "shuvpn_tun_helper"
path = "src/bin/shuvpn_tun_helper.rs"

[lib]
crate-type = ["rlib"]

[build-dependencies]
static_vcruntime = "=3.0.0"

[dependencies]
anyhow.workspace = true
base64.workspace = true
cookie = "0.18"
cookie_store = { version = "=0.22.1", default-features = false }
psl = "=2.1.241"
rsa = "=0.9.10"
zeroize = "=1.9.1"
getrandom = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true, features = ["preserve_order"] }
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
serde.workspace = true
serde_yaml_ng = "=0.10.0"
idna = "1"
regex = "=1.13.1"
scraper = { version = "=0.27.0", default-features = false }
ego-tree = "=0.11.0"
aho-corasick = "=1.1.5"
hickory-proto.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs", "process"] }
tokio-util.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
ipnet = "2"
socket2 = { version = "=0.6.5", features = ["all"] }
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
md-5 = "0.10"
sha2 = "=0.10.9"
sangfor-core.workspace = true
sangfor-tls.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rtnetlink = "=0.23.0"
netlink-packet-route = "=0.33.0"
futures-util = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
