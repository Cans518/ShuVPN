[workspace]
members = ["crates/core", "desktop/src-tauri"]
default-members = ["crates/core", "desktop/src-tauri"]
exclude = ["third_party/sangfor"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
license = "AGPL-3.0"
repository = "https://github.com/shuosc/ShuVPN"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
hickory-proto = { version = "=0.25.2", default-features = false, features = ["std"] }
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
sangfor-core = { path = "third_party/sangfor/sangfor-core" }
sangfor-tls = { path = "third_party/sangfor/sangfor-tls" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuvpn_core = { path = "crates/core" }
tempfile = "3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
windows-sys = "=0.61.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
